[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvalue"
version = "0.1.0"
description = "Fundamental data ingestion and screening toolkit."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Emre Tezel" }]
license = { text = "Apache-2.0" }
dependencies = [
    "pandas>=2.1",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.15",
    "mypy>=1.19",
    "hypothesis>=6.0",
    # Type stubs for third-party runtime deps so mypy needs no per-import
    # `# type: ignore[import-untyped]`. Keep in lockstep with the runtime deps above.
    "types-requests>=2.31",
    "types-PyYAML>=6.0",
    # ``typing_extensions.TypeIs`` backs the metric-shape predicate in
    # pyvalue.metrics.base under a TYPE_CHECKING guard (Python 3.12 has no
    # typing.TypeIs). mypy depends on it anyway; declared so the gate's
    # requirement is visible in the metadata rather than transitive.
    "typing_extensions>=4.10",
]

[project.scripts]
pyvalue = "pyvalue.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Ship the PEP 561 marker so downstream consumers (and our own test tree, when
# type-checked standalone) see pyvalue as a typed package rather than an
# untyped third-party import.
[tool.setuptools.package-data]
pyvalue = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff.lint]
# The lint gate is pinned to an explicit rule set so it cannot drift with
# ruff's release defaults: ruff 0.16 widened its default selection from the
# E4/E7/E9/F core to roughly 415 rules, which turned a tree that was clean
# under 0.15 into ~2,700 findings without a single code change (2026-10-18).
# These four groups are the rules the codebase has actually been held to.
# Widening the set (pyupgrade, isort's `I`, datetime-tz, ...) is a deliberate
# decision with its own sweep, not a side effect of a tool upgrade.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# Strict type coverage is the project standard (see CLAUDE.md): every function
# carries annotations and every body is checked, across src/ AND tests/. These
# flags make `mypy` enforce that rather than silently skipping untyped code.
python_version = "3.12"
files = ["src", "tests"]
disallow_untyped_defs = true   # every function must be annotated
disallow_incomplete_defs = true  # ...fully, not just some params
check_untyped_defs = true      # type-check the bodies too
no_implicit_optional = true    # an implicit None default does not widen to Optional
warn_unused_ignores = true     # a stale `# type: ignore` is itself an error
warn_redundant_casts = true    # a cast() that does nothing is an error
warn_unused_configs = true
warn_unreachable = true         # dead branches (e.g. a narrowed-away Optional) are errors
